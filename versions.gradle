/**
 * Multi-version Minecraft configuration.
 *
 * Usage:
 *   gradle build -Pmc=1.21.1   (default)
 *   gradle build -Pmc=1.20.1
 *
 * Each version block defines the dependency versions for that MC release.
 */

ext {
    // findProperty never throws — falls back to 1.21.1 when -Pmc is absent.
    mc = (findProperty('mc') ?: '1.21.1') as String
}

// Helper: resolve version for the current MC target
ext.versions = { ->
    def v = [:]

    switch (ext.mc) {
        case '1.21.1':
            v.fabric_loader = '0.16.7'
            v.fabric_api = '0.109.0+1.21.1'
            v.forge_version = '52.1.16'
            v.neoforge_version = '21.1.80'
            v.paper_api = '1.21.1-R0.1-SNAPSHOT'
            v.java_version = 21
            v.parchment = null  // Parchment not yet available for 1.21.1
            break

        case '1.20.1':
            v.fabric_loader = '0.15.11'
            v.fabric_api = '0.92.11+1.20.1'
            v.forge_version = '47.4.22'
            v.neoforge_version = null  // NeoForge doesn't support 1.20.1
            v.paper_api = '1.20.1-R0.1-SNAPSHOT'
            v.java_version = 17
            v.parchment = '1.20.1-2023.09.03'
            break

        case '1.21.11':
            // Minecraft 1.21.11 — the latest 1.21.x line, still Java 21
            v.fabric_loader = '0.19.3'
            v.fabric_api = '0.141.6+1.21.11'
            v.forge_version = '61.2.0'
            v.neoforge_version = '21.11.45'
            v.paper_api = '1.21.11-R0.1-SNAPSHOT'
            v.java_version = 21
            v.parchment = null
            break

        case '26.2':
            // Minecraft 26.2 (2026 naming scheme) — requires Java 25
            v.fabric_loader = '0.19.3'
            v.fabric_api = '0.157.0+26.2'
            v.forge_version = '65.1.1'
            v.neoforge_version = '26.2.0.59'
            v.paper_api = '26.2.build.112-stable'
            v.java_version = 25
            v.parchment = null
            break

        default:
            throw new GradleException("Unsupported Minecraft version: ${ext.mc}. Supported: 1.21.1, 1.20.1, 1.21.11, 26.2")
    }

    return v
}
