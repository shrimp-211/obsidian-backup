// Fabric 26.2 (Gradle 9 standalone build) — aligned with the official
// Fabric example-mod template (MC 26.x needs no mappings block).

plugins {
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

apply from: rootProject.file('versions.gradle')
def v = versions()

version = "26.2-${rootProject.mod_version}"
group = 'com.obsidian.backup'

base {
	archivesName = 'obsidian-backup-fabric-26.2'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Reuse the main project's source (shared implementation + version shim).
sourceSets {
	main {
		java {
			srcDirs = [
				rootProject.file('../fabric/src/main/java'),
				rootProject.file('../fabric/src/mc-1.21.11/java'),
			]
		}
		resources {
			srcDirs = [rootProject.file('../fabric/src/main/resources')]
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		obsidian_backup {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:26.2"
	// No mappings block — MC 26.x is not obfuscated.

	implementation "net.fabricmc:fabric-loader:${v.fabric_loader}"
	implementation "net.fabricmc.fabric-api:fabric-api:${v.fabric_api}"

	// Shared library (IPC protocol + cross-platform Named Pipe support)
	implementation project(':common')
	include project(':common')
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 25
}
