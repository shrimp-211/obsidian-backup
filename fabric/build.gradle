plugins {
    // loom 1.13.x is the latest line compatible with Gradle 8.14 (1.14+ needs
    // Gradle 9). It supports 1.20.1 → 1.21.11.
    id 'fabric-loom' version '1.13.3'
    id 'maven-publish'
}

// Apply multi-version configuration
apply from: rootProject.file('versions.gradle')
def v = versions()
def mcVersion = project.mc

version = "${mcVersion}-${rootProject.mod_version}"
group = 'com.obsidian.backup'

// Version-specific source dir for the McCompat shim (selected by -Pmc).
// 1.20.1 reuses 1.21.1 (legacy hasPermission(int)); 26.2 reuses 1.21.11
// (Permission object system introduced in MC 1.21.2+).
def compatVersion = mcVersion
if (mcVersion == '1.20.1') compatVersion = '1.21.1'
if (mcVersion == '26.2') compatVersion = '1.21.11'
def mcCompatDir = "src/mc-${compatVersion}/java"
sourceSets {
    main {
        java { srcDirs = ['src/main/java', mcCompatDir] }
    }
}

base {
    archivesName = "obsidian-backup-fabric-${mcVersion}"
}

loom {
    runs {
        server {
            server()
            ideConfigGenerated(true)
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${v.fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${v.fabric_api}"

    // Shared common library (version-independent)
    implementation project(':common')
    include project(':common')

    // Gson is transitive via common module
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = v.java_version
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
