plugins {
    id 'java-library'
    id 'maven-publish'
}

// The common module contains no MC-version-specific code. The bytecode target
// follows the active version matrix (v.java_version): release 21 when building
// 1.21.1, release 17 when building 1.20.1 — always matching the loaders.
apply from: rootProject.file('versions.gradle')
def v = versions()

group = 'com.obsidian.backup'
version = rootProject.common_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(v.java_version)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = v.java_version
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
