plugins {
    id 'java-library'
    id 'maven-publish'
}

apply from: rootProject.file('versions.gradle')
def v = versions()
def mcVersion = project.mc

version = "${mcVersion}-${rootProject.mod_version}"
group = 'com.obsidian.backup'

base {
    archivesName = "obsidian-backup-bukkit-${mcVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(v.java_version)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${v.paper_api}"
    implementation project(':common')
    // Gson is transitive via common module
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = v.java_version
}

// Bundle the common library into the plugin jar (fat-JAR approach)
jar {
    // Common jar is an input (via runtimeClasspath) — declare the task dependency
    // so Gradle 8 orders the build correctly.
    dependsOn(':common:jar')
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
