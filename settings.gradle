pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'obsidian-backup-parent'

// Shared library — version-independent, loader-independent
include 'common'

// NeoForge (Kotlin mod) — supports 1.21.1 / 1.21.11 / 26.2. Minecraft 1.20.1
// has no NeoForge release, so exclude it from the project graph for 1.20.1.
def activeMc = (findProperty('mc') ?: '1.21.1') as String
if (activeMc != '1.20.1') {
    include 'neoforge'
    project(':neoforge').projectDir = file('mod-neoforge')
}

// Fabric (supports 1.21.1 and 1.20.1 via -Pmc=1.20.1)
include 'fabric'

// MinecraftForge (supports 1.21.1 and 1.20.1)
include 'forge'

// Paper/Bukkit (supports 1.21.1 and 1.20.1)
include 'bukkit'

// Global version constants — injected into every project so subprojects can
// read them via `rootProject.mod_version` / `project.common_version`.
gradle.beforeProject { project ->
    project.ext.common_version = '0.2.0'
    project.ext.mod_version = '0.2.0'
    project.ext.mc = (project.findProperty('mc') ?: '1.21.1') as String
}
