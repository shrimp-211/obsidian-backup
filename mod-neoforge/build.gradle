// NeoForge module (Kotlin implementation).
// Supports multiple MC versions via -Pmc: 1.21.1, 1.21.11, 26.2.
// Minecraft 1.20.1 is NOT supported by NeoForge (no release exists).
apply from: rootProject.file('versions.gradle')
def v = versions()

def mcVersion = (findProperty('mc') ?: '1.21.1') as String
def neoVersion = v.neoforge_version
if (neoVersion == null) {
    throw new GradleException("NeoForge does not support Minecraft ${mcVersion}")
}
def javaTarget = v.java_version

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
}

version = "${mcVersion}-${rootProject.mod_version}"
group = 'com.obsidian.backup'

// Neogradle reads these project properties to resolve MC/Neo artifacts.
project.minecraft_version = mcVersion
project.neo_version = neoVersion

base {
    archivesName = 'obsidian-backup-neoforge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaTarget)
    }
    withSourcesJar()
}

// Configure source sets for the Kotlin implementation
sourceSets {
    main {
        kotlin { srcDirs = ['src/main/kotlin'] }
        resources { srcDirs = ['src/main/resources'] }
    }
}

kotlin {
    jvmToolchain(javaTarget)
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://repo.spongepowered.org/maven' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoVersion}"

    // Kotlin standard library for the NeoForge mod implementation
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"

    // Unix Domain Socket support (Java 16+ native, but JNR for older compat)
    implementation 'com.github.jnr:jnr-unixsocket:0.38.23'

    // JSON processing (lightweight, no Jackson dependency)
    implementation 'com.google.code.gson:gson:2.11.0'
}

// NeoGradle runs configuration
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }
}

// Bytecode target follows the active version matrix
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaTarget
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

// Expand properties in mods.toml (dynamic per MC version)
tasks.withType(ProcessResources).configureEach {
    def neoBase = neoVersion.split('\\.')[0]
    var replaceProperties = [
        minecraft_version      : mcVersion,
        minecraft_version_range: "[${mcVersion},)",
        neo_version            : neoVersion,
        neo_version_range      : "[${neoBase},)",
        loader_version_range   : '[7,)',
        mod_id                 : 'obsidian_backup',
        mod_name               : 'Obsidian Backup',
        mod_version            : rootProject.mod_version,
        mod_authors            : 'ObsidianTeam',
        mod_description        : 'Enterprise-grade CAS incremental backup system for Minecraft servers. Sidecar architecture with UDS IPC, ACID backup transactions, and in-game Brigadier command tree.',
        mod_license            : 'MPL-2.0',
        mod_url                : 'https://github.com/shrimp-211/obsidian-backup',
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
