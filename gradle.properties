# Default Minecraft version for the build
# Override with: gradle build -Pmc=1.20.1
mc = 1.21.1

# JVM args must be compatible with BOTH Java 21 (MC 1.21.1) and Java 17 (MC 1.20.1);
# -XX:+ZGenerational is Java 21+ only and breaks the Java 17 daemon.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
