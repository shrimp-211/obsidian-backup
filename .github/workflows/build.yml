name: Build & Test

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

# Cancel superseded runs — full multi-loader builds are slow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Java multi-version multi-loader
  java:
    name: Java ${{ matrix.mc }} (${{ matrix.loader }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # NOTE: newer MC lines (1.21.11 / 26.2) require Gradle 9 (loom 1.15+,
      # Java 25). ForgeGradle 6 does not yet support Gradle 9, so those are
      # pending tooling. 1.20.1 / 1.21.1 are fully covered here.
      matrix:
        mc: ['1.21.1', '1.20.1']
        loader: [fabric, forge, bukkit]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.mc == '1.21.1' && '21' || '17' }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.loader }} (${{ matrix.mc }})
        run: ./gradlew :${{ matrix.loader }}:build -Pmc=${{ matrix.mc }} --no-daemon

  # Common module (version-independent)
  common:
    name: Common Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build common
        run: ./gradlew :common:build --no-daemon

  # NeoForge module (Kotlin implementation; -Pmc switches 1.21.1/1.21.11/26.2)
  neoforge:
    name: NeoForge 1.21.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build neoforge
        run: ./gradlew :neoforge:build --no-daemon
