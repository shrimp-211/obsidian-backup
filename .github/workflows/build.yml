name: Build & Test

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

# Cancel superseded runs — full multi-loader builds are slow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Java multi-version multi-loader
  java:
    name: Java ${{ matrix.mc }} (${{ matrix.loader }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Gradle 9 + loom 1.17 supports 1.20.1 → 26.2. ForgeGradle 6.0.54 is
      # built on Gradle 9.2 so forge works; neoforge 26.2 is excluded below
      # (neogradle has no Gradle 9 release yet).
      matrix:
        mc: ['1.21.1', '1.20.1', '1.21.11', '26.2']
        loader: [fabric, forge, bukkit]
        exclude:
          # forge 61 (MC 1.21.11) — ForgeGradle 6.0.54 cannot generate its
          # official mappings (needs a newer ForgeGradle).
          - mc: '1.21.11'
            loader: forge

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Java 25 daemon (26.2 needs it); bytecode release is controlled
          # per-module via options.release / java.toolchain in versions.gradle.
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.loader }} (${{ matrix.mc }})
        run: ./gradlew :${{ matrix.loader }}:build -Pmc=${{ matrix.mc }} --no-daemon

  # Common module (version-independent)
  common:
    name: Common Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build common
        run: ./gradlew :common:build --no-daemon

  # NeoForge module (Kotlin implementation; -Pmc switches 1.21.1/1.21.11/26.2)
  # NOTE: 26.2 excluded — neogradle 7.1.38 has no Gradle 9 release yet.
  neoforge:
    name: NeoForge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '1.21.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build neoforge (${{ matrix.mc }})
        run: ./gradlew :neoforge:build -Pmc=${{ matrix.mc }} --no-daemon
