name: Build & Test

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

# Cancel superseded runs — full multi-loader builds are slow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Java multi-version multi-loader
  java:
    name: Java ${{ matrix.mc }} (${{ matrix.loader }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 26.2 requires Gradle 9 (loom 1.14+) which ForgeGradle 6 rejects at
      # runtime ("Gradle 9.0+ not supported yet"). 1.20.1/1.21.1/1.21.11 are
      # covered here (loom 1.13.3 + Gradle 8.14).
      matrix:
        mc: ['1.21.1', '1.20.1', '1.21.11']
        loader: [fabric, forge, bukkit]
        exclude:
          # forge 61 (MC 1.21.11) — ForgeGradle 6.0.54 cannot generate its
          # official mappings (needs a newer ForgeGradle).
          - mc: '1.21.11'
            loader: forge

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Java 21 daemon; bytecode release is controlled per-module via
          # options.release / java.toolchain in versions.gradle.
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.loader }} (${{ matrix.mc }})
        run: ./gradlew :${{ matrix.loader }}:build -Pmc=${{ matrix.mc }} --no-daemon

  # Common module (version-independent)
  common:
    name: Common Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build common
        run: ./gradlew :common:build --no-daemon

  # NeoForge module (Kotlin implementation; -Pmc switches 1.21.1/1.21.11/26.2)
  # NOTE: 26.2 excluded — neogradle 7.1.38 has no Gradle 9 release yet.
  neoforge:
    name: NeoForge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '1.21.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build neoforge (${{ matrix.mc }})
        run: ./gradlew :neoforge:build -Pmc=${{ matrix.mc }} --no-daemon

  # Minecraft 26.2 standalone build (Gradle 9 + Java 25; Fabric + Bukkit only,
  # since ForgeGradle 6 / neogradle 7.1.38 reject Gradle 9 at runtime).
  mc26:
    name: 26.2 (${{ matrix.loader }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, bukkit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.loader }} (26.2)
        run: ./gradlew :${{ matrix.loader }}:build --no-daemon
        working-directory: mc26.2
