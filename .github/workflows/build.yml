name: Build & Test

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

# Cancel superseded runs — full multi-loader builds are slow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Java multi-version multi-loader
  java:
    name: Java ${{ matrix.mc }} (${{ matrix.loader }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 26.2 requires Java 25 + Gradle 9 (loom 1.14+) — pending tooling.
      # 1.20.1 / 1.21.1 / 1.21.11 are covered (loom 1.13.3 + Gradle 8.14).
      matrix:
        mc: ['1.21.1', '1.20.1', '1.21.11']
        loader: [fabric, forge, bukkit]
        exclude:
          # forge 61 (MC 1.21.11) needs ForgeGradle 7 (not yet released).
          # ForgeGradle 6.0.54 cannot generate official mappings for it.
          - mc: '1.21.11'
            loader: forge

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # loom 1.13+ needs Java 21 to run; bytecode release is controlled
          # per-module via options.release / java.toolchain in versions.gradle.
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.loader }} (${{ matrix.mc }})
        run: ./gradlew :${{ matrix.loader }}:build -Pmc=${{ matrix.mc }} --no-daemon

  # Common module (version-independent)
  common:
    name: Common Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build common
        run: ./gradlew :common:build --no-daemon

  # NeoForge module (Kotlin implementation; -Pmc switches 1.21.1/1.21.11/26.2)
  neoforge:
    name: NeoForge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '1.21.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build neoforge (${{ matrix.mc }})
        run: ./gradlew :neoforge:build -Pmc=${{ matrix.mc }} --no-daemon
